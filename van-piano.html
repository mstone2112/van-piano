<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Van's Piano">
<title>Van's Piano · 钢琴课</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:wght@600;800&family=Noto+Music&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --ink:#17202B; --muted:#586375; --line:#D3D9E1;
  --accent:#2747B8; --accent-ink:#FFFFFF; --soft:#E2E8F7;
  --mark:#F2B135; --good:#1E8A5A; --bad:#C23B2E;
  --key-white:#FBFBF8; --key-black:#1C1F25; --key-edge:#B9C0CA;
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",-apple-system,system-ui,sans-serif;
  --music:"Noto Music","Apple Symbols",serif;
  /* layout: one reading column (~66ch) with full-width practice cards; each card carries its own keyboard */
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11151B; --surface:#1A2029; --ink:#E6EAF0; --muted:#9AA5B5; --line:#2D3644;
    --accent:#8DA3FF; --accent-ink:#0E1424; --soft:#232C40;
    --mark:#F4BE4F; --good:#47C08A; --bad:#F07A6D;
    --key-white:#F1F1EC; --key-black:#0A0C0F; --key-edge:#5B6473;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11151B; --surface:#1A2029; --ink:#E6EAF0; --muted:#9AA5B5; --line:#2D3644;
  --accent:#8DA3FF; --accent-ink:#0E1424; --soft:#232C40;
  --mark:#F4BE4F; --good:#47C08A; --bad:#F07A6D;
  --key-white:#F1F1EC; --key-black:#0A0C0F; --key-edge:#5B6473;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.55;touch-action:manipulation;-webkit-text-size-adjust:100%}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:34px;font-weight:800;letter-spacing:-.01em}
h2{font-size:24px;font-weight:800}
h3{font-size:19px;font-weight:600}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 10px) max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left))}
.top-in{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--display);font-weight:800;font-size:21px;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:8px}
.brand svg{flex:none}
.spacer{flex:1}
.nav.row{flex-wrap:nowrap;gap:2px}
.nav a{white-space:nowrap;font-weight:700;text-decoration:none;padding:8px 12px;border-radius:999px;color:var(--ink)}
.nav a.on{background:var(--soft);color:var(--accent)}
.who{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px 6px 6px;font-weight:700;min-height:44px}
.dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;flex:none}

main{max-width:1040px;margin:0 auto;padding:24px max(16px,env(safe-area-inset-left)) calc(60px + env(safe-area-inset-bottom))}
.col{max-width:700px}
.stack{display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.muted{color:var(--muted)}
.small{font-size:15px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;font-weight:700;min-height:46px;display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.quiet{background:transparent}
.btn:disabled{opacity:.45;cursor:default}
.btn svg{flex:none}
.stack>.chip{align-self:flex-start}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--accent)}
.chip.opt{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.chip.done{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}

.status{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:8px;margin-top:6px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.status.ok i{background:var(--good)}
.status.warn i{background:var(--mark)}

/* home */
.hero{display:grid;gap:18px;grid-template-columns:1fr auto;align-items:end}
@media (max-width:640px){.hero{grid-template-columns:1fr}}
.bar{height:10px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent);border-radius:99px}
.unit h3{margin:6px 0 10px;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-family:var(--body);font-weight:700}
.lessons{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.lrow{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-decoration:none;color:var(--ink);min-height:72px}
.lrow .num{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;border:2px solid var(--line);font-variant-numeric:tabular-nums;font-size:15px}
.lrow.done .num{background:var(--good);border-color:var(--good);color:#fff}
.lrow.next{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent)}
.lrow.next .num{border-color:var(--accent);color:var(--accent)}
.lrow .t,.lrow .s{display:block}
.lrow .t{font-weight:700;line-height:1.25}
.lrow .s{font-size:14px;color:var(--muted);line-height:1.35;margin-top:2px}
.pace{display:grid;gap:12px}
.pace .p{display:grid;grid-template-columns:30px 110px 1fr 70px;gap:10px;align-items:center}
.pace .p b{font-variant-numeric:tabular-nums;text-align:right}
.pickers{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.pick{display:flex;gap:14px;align-items:center;padding:18px;border-radius:16px;border:1px solid var(--line);background:var(--surface);text-align:left;width:100%}
.pick .dot{width:48px;height:48px;font-size:21px}
.pick b{display:block;font-size:20px}

/* lesson */
.lhead .kicker{font-size:15px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.lesson p{margin:0;max-width:66ch}
.lesson .lead{font-size:20px}
.tip{border-left:4px solid var(--mark);background:color-mix(in srgb,var(--mark) 12%,var(--surface));padding:12px 16px;border-radius:0 12px 12px 0;max-width:66ch}
.tip b:first-child{display:block;font-size:14px;letter-spacing:.05em;text-transform:uppercase}
.track-note{border-left:4px solid var(--accent);background:var(--soft);padding:12px 16px;border-radius:0 12px 12px 0;max-width:66ch}
.track-note .who-for{display:block;font-size:14px;font-weight:700;color:var(--accent);letter-spacing:.04em;text-transform:uppercase}
.cap{font-size:15px;color:var(--muted);margin-top:8px}
.endbar{display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:18px;margin-top:8px}

/* keyboard */
.kbwrap{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;padding:4px 0 8px;scrollbar-width:thin}
.kb{position:relative;height:var(--kh,170px);width:calc(var(--wk,44px) * var(--nw));margin:0 auto;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:pan-x}
.key{position:absolute;top:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;-webkit-tap-highlight-color:transparent}
.key.white{width:var(--wk);height:100%;background:var(--key-white);border:1px solid var(--key-edge);border-top:none;border-radius:0 0 8px 8px;z-index:1;padding-bottom:8px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.06)}
.key.black{width:var(--bw);height:62%;background:var(--key-black);border-radius:0 0 6px 6px;z-index:2;padding-bottom:6px;box-shadow:inset 0 -5px 0 rgba(255,255,255,.1)}
.key .lb{font-weight:700;font-size:clamp(12px,calc(var(--wk) * .34),18px);color:#2A3140;pointer-events:none}
.key.black .lb{color:#E9ECF2;font-size:clamp(9px,calc(var(--wk) * .24),13px)}
.kb:not(.nolabels) .key.mid .lb::after{content:"";display:block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin:3px auto 0}
.key .fg{position:absolute;top:28%;width:clamp(20px,calc(var(--wk) * .62),32px);height:clamp(20px,calc(var(--wk) * .62),32px);border-radius:50%;display:none;place-items:center;font-weight:800;font-size:clamp(12px,calc(var(--wk) * .34),17px);background:var(--ink);color:var(--bg);pointer-events:none}
.key.black .fg{top:20%;width:clamp(16px,calc(var(--wk) * .48),26px);height:clamp(16px,calc(var(--wk) * .48),26px);background:#fff;color:#111}
.key.hasfg .fg{display:grid}
.key.ga{background:#CFE0FF}.key.black.ga{background:#3D63D8}
.key.gb{background:#FFE2B8}.key.black.gb{background:#C46A12}
.key.target{background:var(--mark)!important}
.key.black.target{background:#D99A1B!important}
.key.play{background:#9DB3FF!important}
.key.black.play{background:#3557C9!important}
.key.down{filter:brightness(.88)}
.key.good{background:#8EE0B5!important}
.key.bad{background:#F6A39A!important}
.kbtools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}

/* practice card */
.prac{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.prac .ph{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.prac .ph h3{font-size:20px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:none;background:transparent;padding:9px 14px;font-weight:700;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tempo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
.tempo input{width:150px;accent-color:var(--accent)}
.tempo output{font-variant-numeric:tabular-nums;min-width:66px}
.tog{display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:700;min-height:44px}
.tog input{width:22px;height:22px;accent-color:var(--accent)}
.pstat{min-height:28px;font-weight:700}
.pstat.good{color:var(--good)}.pstat.bad{color:var(--bad)}
.staffbox{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px;background:var(--key-white);padding:4px 0}
svg.staff{display:block}
svg.staff .ln{stroke:#4A5262;stroke-width:1}
svg.staff .bl{stroke:#4A5262;stroke-width:1.2}
svg.staff .bl2{stroke:#20242C;stroke-width:3.5}
svg.staff .clef{font-family:var(--music);fill:#20242C}
svg.staff .ts{font-family:var(--display);font-weight:800;fill:#20242C;font-size:20px}
svg.staff .hd{fill:#20242C;stroke:#20242C;stroke-width:1.4}
svg.staff .hd.hollow{fill:#FBFBF8}
svg.staff .stem,svg.staff .flag,svg.staff .led{stroke:#20242C;stroke-width:1.4;fill:none}
svg.staff .dt{fill:#20242C}
svg.staff .rest{fill:#20242C}
svg.staff .rest-ln{stroke:#20242C;stroke-width:1.6;fill:none}
svg.staff .tie{stroke:#20242C;stroke-width:1.4;fill:none}
svg.staff .acc{font-family:var(--music);font-size:22px;fill:#20242C}
svg.staff .nm{font-family:var(--body);font-weight:700;font-size:13px;fill:#2747B8;text-anchor:middle}
svg.staff .fgn{font-family:var(--body);font-weight:700;font-size:12px;fill:#6A7383;text-anchor:middle}
svg.staff .tag{}
.zh{font-weight:600;color:var(--muted);font-size:.85em;margin-left:6px}
svg.staff .tag{font-family:var(--body);font-size:12px;fill:#6A7383}
svg.staff .nt.now .hd{fill:#2747B8;stroke:#2747B8}
svg.staff .nt.now .stem,svg.staff .nt.now .flag{stroke:#2747B8}
svg.staff .nt.tgt .hd{fill:#E09A10;stroke:#E09A10}
svg.staff .nt.tgt .stem{stroke:#E09A10}
svg.staff .nt.ok .hd{fill:#1E8A5A;stroke:#1E8A5A}
svg.staff .nt.no .hd{fill:#C23B2E;stroke:#C23B2E}
svg.staff .hl{fill:#F2B135;opacity:.28}

/* quizzes */
.qbig{font-family:var(--display);font-size:30px;font-weight:800;min-height:40px}
.answers{display:flex;gap:8px;flex-wrap:wrap}
.answers button{min-width:56px;min-height:56px;font-size:22px;font-weight:800;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.answers button.good{background:var(--good);border-color:var(--good);color:#fff}
.answers button.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.score{font-variant-numeric:tabular-nums;font-weight:700;color:var(--muted);font-size:15px}
.pad{width:100%;min-height:150px;border-radius:20px;border:2px solid var(--line);background:var(--soft);font-family:var(--display);font-size:26px;font-weight:800;color:var(--accent);-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.pad.beat{border-color:var(--accent)}
.pad.hit{background:color-mix(in srgb,var(--accent) 25%,var(--soft))}
.tl{position:relative;height:56px;border-radius:10px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.tl .ex{position:absolute;top:6px;bottom:6px;width:3px;margin-left:-1.5px;background:var(--muted);border-radius:2px}
.tl .tp{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%}
.tl .tp.ok{background:var(--good)}.tl .tp.no{background:var(--bad)}
.hands{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.hands figure{margin:0;text-align:center}
.hands figcaption{font-weight:700;font-size:15px;color:var(--muted)}
.hand-skin{fill:color-mix(in srgb,var(--mark) 22%,var(--surface));stroke:var(--muted);stroke-width:2}
.hand-on{fill:var(--mark);stroke:var(--ink)}
.hand-num{font-family:var(--display);font-weight:800;font-size:20px;fill:var(--ink);text-anchor:middle}

/* modal */
.veil{position:fixed;inset:0;background:rgba(10,14,20,.45);z-index:50;display:grid;place-items:center;padding:16px}
.sheet{background:var(--surface);border-radius:20px;padding:22px;width:min(520px,100%);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:16px;border:1px solid var(--line)}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-weight:700;font-size:15px}
.field input[type=text]{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg);font-size:18px}
.choice{display:grid;gap:8px}
.choice label{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer}
.choice input{margin-top:5px;width:20px;height:20px;accent-color:var(--accent)}
.choice label:has(input:checked){border-color:var(--accent);background:var(--soft)}
.choice small{display:block;color:var(--muted);font-size:14px;line-height:1.4}
.heard{font-weight:700;font-size:15px;color:var(--accent);display:flex;align-items:center;gap:10px;min-height:24px}
.meter{width:120px;height:8px;border-radius:99px;background:var(--soft);overflow:hidden;display:inline-block}
.meter>span{display:block;height:100%;width:0;background:var(--good);border-radius:99px}
.btn[data-mic][aria-pressed="true"],.btn.mic-on{background:color-mix(in srgb,var(--good) 14%,var(--surface));border-color:var(--good);color:var(--good)}
.bignote{font-family:var(--display);font-weight:800;font-size:56px;line-height:1;min-width:120px}
textarea.code{width:100%;min-height:90px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--bg);font:14px/1.4 ui-monospace,Menlo,monospace;color:var(--ink)}
.jp{overflow-x:auto}.jp table{border-collapse:collapse;font-variant-numeric:tabular-nums}.jp th,.jp td{border:1px solid var(--line);padding:6px 10px;text-align:center}.jp th{text-align:left;font-size:14px;color:var(--muted);white-space:nowrap}.jp td{font-weight:700;min-width:40px}
.banner{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-size:15px}
@media (max-width:520px){h1{font-size:28px}.top-in{gap:6px}.nav a{padding:7px 7px;font-size:15px}.brand svg{width:26px;height:26px}.who{font-size:15px;padding:4px 10px 4px 4px;min-height:40px;max-width:44vw}.who .dot{width:28px;height:28px}.brand span{display:none}.pace .p{grid-template-columns:30px 80px 1fr 56px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
/* ---------- van-piano additions ---------- */
[hidden]{display:none!important}
.kb:not(.nolabels) .key.mid .lb::after{width:14px;height:3px;border-radius:2px}
.tip .zhp b{display:inline;font-size:inherit;letter-spacing:0;text-transform:none}
.nav a .enn{font-weight:600}
@media (max-width:520px){.nav a .enn{display:none}}
.gear{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:44px;height:44px;display:grid;place-items:center;flex:none;color:var(--ink)}
.pp{display:flex;flex-direction:column;gap:4px;max-width:66ch}
.zhp{color:var(--muted);font-size:16px;line-height:1.6}
.tip .zhp{display:block;margin-top:4px}
.lrow .tz{font-weight:600;color:var(--muted);font-size:15px;margin-left:6px}
.tog select{font:inherit;font-size:15px;padding:6px 8px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-height:40px}
.key .lb{display:flex;flex-direction:column;align-items:center;line-height:1.05}
.key .lb .kd{font-size:11px;line-height:8px;height:8px;letter-spacing:-1px}
.key .lb small{font-size:.7em}
/* numbered notation (简谱) */
.jpbox{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:8px 8px 2px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.jhead{font-weight:700;font-size:15px;color:var(--muted);margin:0 0 6px 2px}
.jsys{display:flex;flex-direction:column;margin-bottom:12px}
.jrow{display:flex;align-items:stretch}
.jtag{flex:none;display:flex;align-items:center;font-size:13px;font-weight:700;color:var(--muted)}
.jbar{position:relative;display:flex;flex:none;padding:0 4px;border-right:1.5px solid var(--key-edge)}
.jbar.first{border-left:1.5px solid var(--key-edge)}
.jbar.end{border-right:4px double var(--muted)}
.jbar.out{opacity:.3}
.jbn{position:absolute;left:3px;top:-1px;font-size:10px;color:var(--muted);font-weight:700;font-family:var(--body)}
.jn{flex:none;display:flex;flex-direction:column;align-items:center;font-family:var(--display);font-weight:800;color:var(--ink);cursor:pointer;border-radius:6px;-webkit-tap-highlight-color:transparent}
.jo{height:9px;line-height:9px;font-size:9px;letter-spacing:-1px}
.jv{align-self:stretch;text-align:center;line-height:1.15;padding-bottom:1px;white-space:nowrap}
.jv.u1{border-bottom:2px solid currentColor}
.jv.u2{border-bottom:6px double currentColor}
.jn.gs .jv{margin-left:3px}.jn.ge .jv{margin-right:3px}
.jv sup{font-size:.55em;vertical-align:top;margin-right:1px}
.jdot{font-weight:800;margin-left:1px}
.jn.dash{color:var(--muted)}
.jn.now{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.jn.tgt{background:color-mix(in srgb,var(--mark) 40%,transparent)}

</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="#home" aria-label="Van's Piano home">

<script>
"use strict";
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
function el(html){const t=document.createElement("template");t.innerHTML=html.trim();return t.content.firstElementChild}
function isPlain(o){return o&&typeof o==="object"&&!Array.isArray(o)}
function merge(a,b){const out={...(a||{})};for(const k in b){out[k]=isPlain(b[k])&&isPlain(out[k])?merge(out[k],b[k]):b[k]}return out}

/* ---------- notes ---------- */
const LET="CDEFGAB", PC={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const SHARP_NAMES=["C","C♯","D","E♭","E","F","F♯","G","A♭","A","B♭","B"];
function parseNote(s){const m=/^([A-G])([#b]?)(\d)$/.exec(s);if(!m)throw new Error("bad note "+s);const L=m[1],acc=m[2],oct=+m[3];return{L,acc,oct,midi:(oct+1)*12+PC[L]+(acc==="#"?1:acc==="b"?-1:0),step:oct*7+LET.indexOf(L)}}
const midiOf=s=>parseNote(s).midi;
const isBlack=m=>[1,3,6,8,10].includes(((m%12)+12)%12);
const pretty=s=>s.replace("#","♯").replace("b","♭");
function nameOfMidi(m){return SHARP_NAMES[m%12]}
function letterOf(s){const p=parseNote(s);return p.L+(p.acc==="#"?"♯":p.acc==="b"?"♭":"")}

/* ---------- audio: synthesized piano (no samples, no licences) ---------- */
let AC=null,MASTER=null,NOISE=null;
function audio(){
  if(!AC){
    const C=window.AudioContext||window.webkitAudioContext; if(!C) return null;
    AC=new C();
    try{ if(navigator.audioSession) navigator.audioSession.type="playback"; }catch(e){}
    const comp=AC.createDynamicsCompressor(); comp.threshold.value=-16; comp.ratio.value=4; comp.attack.value=0.003; comp.release.value=0.2;
    MASTER=AC.createGain(); MASTER.gain.value=0.9; MASTER.connect(comp); comp.connect(AC.destination);
    NOISE=AC.createBuffer(1,AC.sampleRate*0.05,AC.sampleRate); const d=NOISE.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
    const s=AC.createBufferSource(); s.buffer=AC.createBuffer(1,1,22050); s.connect(AC.destination); s.start(0);
  }
  if(AC.state!=="running"){ AC.resume().catch(()=>{}); }
  return AC;
}
document.addEventListener("pointerdown",()=>audio(),{capture:true});
function playNote(midi,o={}){
  const c=audio(); if(!c) return {release(){}};
  const t=o.when??c.currentTime, vel=o.vel??0.75, dest=o.dest||MASTER;
  const f=440*Math.pow(2,(midi-69)/12);
  const out=c.createGain(); out.gain.value=0;
  const lp=c.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=Math.min(9000,f*6+900); lp.Q.value=0.4;
  out.connect(lp); lp.connect(dest);
  const tau=Math.max(0.35,1.9-(midi-36)*0.032);
  const peak=vel*0.2*(midi<52?1.15:1);
  out.gain.setValueAtTime(0,t); out.gain.linearRampToValueAtTime(peak,t+0.005); out.gain.setTargetAtTime(0,t+0.005,tau);
  const P=[[1,1],[2,.55],[3,.3],[4,.16],[5,.09],[6,.05],[7,.03],[8,.02]], B=0.0004, oscs=[];
  for(const [n,a] of P){
    const fn=f*n*Math.sqrt(1+B*n*n); if(fn>15000) continue;
    const os=c.createOscillator(); os.frequency.value=fn;
    const g=c.createGain(); g.gain.setValueAtTime(a,t); g.gain.setTargetAtTime(a*0.05,t,(tau*1.3)/Math.sqrt(n));
    os.connect(g); g.connect(out); os.start(t); oscs.push(os);
  }
  const nz=c.createBufferSource(); nz.buffer=NOISE; const bp=c.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=Math.min(6000,f*3); bp.Q.value=1.2;
  const ng=c.createGain(); ng.gain.value=vel*0.05; nz.connect(bp); bp.connect(ng); ng.connect(out); nz.start(t);
  let done=false;
  const release=(when)=>{ if(done) return; done=true; const r=Math.max(when??c.currentTime,t+0.12); out.gain.setTargetAtTime(0,r,0.07); oscs.forEach(os=>{try{os.stop(r+0.6)}catch(e){}}); };
  if(o.dur!=null) release(t+o.dur); else setTimeout(()=>release(),6000);
  return {release};
}
function click(when,accent,dest){
  const c=audio(); if(!c) return;
  const os=c.createOscillator(); os.frequency.value=accent?1760:1250;
  const g=c.createGain(); g.gain.setValueAtTime(0.0001,when); g.gain.exponentialRampToValueAtTime(accent?0.45:0.25,when+0.002); g.gain.exponentialRampToValueAtTime(0.0001,when+0.05);
  os.connect(g); g.connect(dest||MASTER); os.start(when); os.stop(when+0.07);
}
function newBus(){const c=audio(); if(!c) return null; const b=c.createGain(); b.connect(MASTER); return b}
function killBus(b){ if(!b||!AC) return; b.gain.setTargetAtTime(0,AC.currentTime,0.02); setTimeout(()=>{try{b.disconnect()}catch(e){}},400) }

/* ---------- microphone listening: pitch detection for single notes ---------- */
let MIC_OK=false; try{ MIC_OK=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)&&window.self===window.top; }catch(e){ MIC_OK=false; }
const Mic={on:false,stream:null,src:null,an:null,buf:null,raf:0,subs:new Set(),ui:new Set(),level:0,heard:null};
function yinPitch(buf,sr){
  const W=1024, tMin=Math.floor(sr/1400), tMax=Math.min(W-1,Math.floor(sr/90));
  const c=new Float32Array(tMax+2); c[0]=1; let run=0;
  for(let t=1;t<=tMax+1;t++){ let sum=0; for(let j=0;j<W;j++){ const x=buf[j]-buf[j+t]; sum+=x*x; } run+=sum; c[t]=run>0?sum*t/run:1; }
  let tau=-1;
  for(let t=tMin;t<=tMax;t++){ if(c[t]<0.15){ while(t+1<=tMax&&c[t+1]<c[t]) t++; tau=t; break; } }
  if(tau<0){ let best=1,bt=-1; for(let t=tMin;t<=tMax;t++){ if(c[t]<best){best=c[t];bt=t} } if(best<0.25) tau=bt; else return null; }
  const a=c[tau-1],b=c[tau],e=c[tau+1]; const den=a+e-2*b; const shift=den?clamp(0.5*(a-e)/den,-1,1):0;
  return {f:sr/(tau+shift),q:1-b};
}
function micListen(fn){ Mic.subs.add(fn); return ()=>Mic.subs.delete(fn); }
function micEmit(m){ Mic.heard=m; Mic.subs.forEach(f=>{try{f(m)}catch(e){}}); }
async function micStart(){
  const c=audio(); if(!c) throw new Error("no audio");
  try{ if(navigator.audioSession) navigator.audioSession.type="play-and-record"; }catch(e){}
  const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  Mic.stream=stream; Mic.src=c.createMediaStreamSource(stream); Mic.an=c.createAnalyser(); Mic.an.fftSize=2048; Mic.src.connect(Mic.an);
  Mic.buf=new Float32Array(Mic.an.fftSize); Mic.on=true;
  const ring=[]; let floor=0.004, lastOn=0, pending=0, votes=[], lastEmit=null, quietSince=0, stable=null, stableN=0;
  const loop=()=>{
    if(!Mic.on) return;
    Mic.an.getFloatTimeDomainData(Mic.buf);
    let ss=0; for(let i=0;i<Mic.buf.length;i++) ss+=Mic.buf[i]*Mic.buf[i];
    const rms=Math.sqrt(ss/Mic.buf.length), now=performance.now();
    if(rms<floor*2) floor=floor*0.98+rms*0.02;
    const thr=Math.max(0.006,floor*3);
    Mic.level=clamp(rms/0.15,0,1);
    const ringMin=ring.length?Math.min(...ring):rms, prev=ring.length?ring[ring.length-1]:rms;
    ring.push(rms); if(ring.length>8) ring.shift();
    if(rms>thr&&rms>ringMin*1.7&&rms>prev*1.12&&now-lastOn>110){ lastOn=now; pending=now+320; votes=[]; }
    let midi=null;
    if(rms>thr){ const r=yinPitch(Mic.buf,c.sampleRate); if(r&&r.q>0.8){ const m=Math.round(69+12*Math.log2(r.f/440)); if(m>=36&&m<=96) midi=m; } quietSince=0; }
    else { if(!quietSince) quietSince=now; if(now-quietSince>220) lastEmit=null; }
    if(midi===stable) stableN++; else { stable=midi; stableN=midi==null?0:1; }
    if(pending){
      if(midi!=null&&now-lastOn>25) votes.push(midi);
      const last2=votes.slice(-2);
      if(last2.length===2&&last2[0]===last2[1]){ pending=0; lastEmit=last2[0]; micEmit(last2[0]); }
      else if(now>pending){ pending=0; if(votes.length){ const cnt={}; votes.forEach(v=>cnt[v]=(cnt[v]||0)+1); const m=+Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0][0]; lastEmit=m; micEmit(m); } }
    } else if(stable!=null&&stableN>=4&&lastEmit!=null&&stable!==lastEmit&&Math.abs(stable-lastEmit)!==12){ lastEmit=stable; micEmit(stable); }
    Mic.ui.forEach(f=>{try{f()}catch(e){}});
    Mic.raf=requestAnimationFrame(loop);
  };
  Mic.raf=requestAnimationFrame(loop);
}
function micStop(){
  Mic.on=false; cancelAnimationFrame(Mic.raf);
  try{ Mic.stream&&Mic.stream.getTracks().forEach(t=>t.stop()); }catch(e){}
  try{ Mic.src&&Mic.src.disconnect(); }catch(e){}
  Mic.stream=Mic.src=Mic.an=null; Mic.level=0; Mic.heard=null;
  try{ if(navigator.audioSession) navigator.audioSession.type="playback"; }catch(e){}
  Mic.ui.forEach(f=>{try{f()}catch(e){}});
}
async function micToggle(msgEl){
  if(Mic.on){ micStop(); return; }
  try{ await micStart(); }
  catch(e){ if(msgEl){ msgEl.className="pstat bad"; msgEl.textContent="The microphone isn't available. In Safari, tap the aA button in the address bar, choose Website Settings, set Microphone to Allow, then try again."; } }
  Mic.ui.forEach(f=>{try{f()}catch(e){}});
}
const micIcon=()=>`<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="5" y="1" width="6" height="9" rx="3" fill="currentColor"/><path d="M3 7.5a5 5 0 0 0 10 0M8 12.5V15" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>`;
const noteLabel=m=>nameOfMidi(m)+(Math.floor(m/12)-1);
/* a mic button + "heard" line bound to the shared Mic state */
function micControls(host,msgEl,key){
  if(!MIC_OK) return null;
  const btn=el(`<button class="btn" type="button" data-mic aria-pressed="false"></button>`);
  const heard=el(`<div class="heard" hidden><span class="meter"><span></span></span><span data-t>Play a key on your piano… 请弹一个键……</span></div>`);
  const sync=()=>{ btn.setAttribute("aria-pressed",Mic.on); btn.innerHTML=micIcon()+(Mic.on?" Listening 正在听":" Use my piano 用我的钢琴"); heard.hidden=!Mic.on; $(".meter>span",heard).style.width=(Mic.level*100)+"%"; };
  btn.onclick=()=>micToggle(msgEl);
  Mic.ui.add(sync); DISPOSE.push(()=>Mic.ui.delete(sync)); sync();
  const off=micListen(m=>{ $("[data-t]",heard).textContent="Heard "+jnText(m,key||"C")+" · "+noteLabel(m); }); DISPOSE.push(off);
  return {btn,heard};
}

/* ---------- 简谱 numbers: 1 = the key note in the octave of middle C ---------- */
const KEYPC={C:0,D:2,F:5,G:7};
const JMAP=[["",1],["♯",1],["",2],["♯",2],["",3],["",4],["♯",4],["",5],["♯",5],["",6],["♭",7],["",7]];
function jn(m,key){ const t=60+(KEYPC[key||"C"]??0), rel=m-t, w=((rel%12)+12)%12; const [acc,d]=JMAP[w]; return {acc,d,oct:Math.floor(rel/12)}; }
function jnText(m,key){ const j=jn(m,key); return j.acc+j.d+(j.oct>0?"̇".repeat(j.oct):j.oct<0?"̣".repeat(-j.oct):""); }
function jnKeyHTML(m,key,all){ const j=jn(m,key); if(j.acc&&!all) return ""; return `<span class="kd">${"•".repeat(Math.max(0,j.oct))}</span><span>${j.acc?`<small>${j.acc}</small>`:""}${j.d}</span><span class="kd">${"•".repeat(Math.max(0,-j.oct))}</span>`; }

/* ---------- song format ---------- */
function parseLine(str){
  const out=str.trim().split(/\s+/).filter(t=>t!=="|").map(tok=>{
    let tie=false; if(tok.endsWith("~")){ tie=true; tok=tok.slice(0,-1); }
    const [n,d,f,label]=tok.split(":");
    if(n==="R") return {n:null,d:+(d||1),f:null,label:null};
    const ns=n.split("+");
    return {n:ns.length>1?ns:ns[0], d:+(d||1), f:f?f.split("+").map(Number):null, label:label||null, tie};
  });
  out.forEach((x,i)=>{ if(i>0&&out[i-1].tie) x.tied=true; });
  return out;
}

/* fill in five-finger-position fingering wherever a song doesn't give it */
function autoFingers(notes,hand){
  const st=notes.map(nt=>(nt.n&&!Array.isArray(nt.n))?parseNote(nt.n).step:null);
  let t=null;
  for(let i=0;i<notes.length;i++){
    const sv=st[i]; if(sv==null) continue;
    if(notes[i].tied&&i>0&&notes[i-1].f){ notes[i].f=notes[i-1].f; continue; }
    if(t==null||sv<t||sv>t+4){ let lo=sv,hi=sv; for(let j=i;j<notes.length;j++){ const sj=st[j]; if(sj==null) continue; const nl=Math.min(lo,sj),nh=Math.max(hi,sj); if(nh-nl>4) break; lo=nl; hi=nh; } t=lo; }
    if(!notes[i].f) notes[i].f=[hand==="L"?5-(sv-t):(sv-t)+1];
  }
}
Object.values(SONGS).forEach(sg=>sg.parts.forEach(p=>autoFingers(p.notes,p.clef==="bass"?"L":"R")));

  {t:"p",h:"Find <b>middle C</b>: the white key just left of the pair of black keys nearest the middle. In every lesson here 1=C, so middle C is <b>1</b>, and the white keys to its right are 2 3 4 5 6 7.",zh:"找到<b>中央C</b>：靠近中间那组两个黑键左边的白键。这里每一课都是 1=C，所以中央C就是 <b>1</b>，右边的白键依次是 2 3 4 5 6 7。"},

  {t:"findKey",id:"q-find1",title:"Find the numbers · 找音",from:"C3",to:"C6",labels:"none",intro:"The keys have no labels here. Use the black-key groups to find each number. 这里琴键没有标记，用黑键分组来找。",asks:[{p:"Tap 1, middle C · 点中央的 1",n:"C4"},{p:"Tap 3 · 点 3",n:"E4"},{p:"Tap 5 · 点 5",n:"G4"},{p:"Tap 2 · 点 2",n:"D4"},{p:"Tap 4 · 点 4",n:"F4"},{p:"Tap 1̇, the high 1 · 点高音 1̇",n:"C5"}]},

  {t:"p",h:"You already know both parts from the earlier lesson. Choose <b>Both</b>, slow the speed right down, and use <b>Practice</b>: the app waits until you've pressed every key that starts together.",zh:"两只手的部分你在前面已经学过了。选<b>双手</b>，把速度调慢，用<b>练习</b>：app 会等你把一起开始的键都按下。"},

 {id:"farewell1",unit:1,title:"Farewell: the first half",zh:"送别：前半首",mins:25,sum:"Your first Chinese song, bars 1–8, with the right hand moving.",sumzh:"第一首中国歌：第 1–8 小节，右手要移动位置。",blocks:[
  {t:"p",cls:"lead",h:"送别 (Farewell) is your first Chinese song. This lesson covers the first half, bars 1–8, with one long left-hand note per bar.",zh:"《送别》是你的第一首中国歌。这一课学前半首，第 1 到 8 小节，左手每小节一个长音。"},

function mergeLearner(cur,inc){

      const w=await ghFetch("/contents/progress.json","PUT",body);

function staffSVG(o){
  const bpb=o.bpb||4, key=o.key||"", ks=key==="G"||key==="F";

  const xOf=b=>left+b*unit+unit*0.45;

  parts.forEach((p,pi)=>{
    const top=pi*blockH+34, bot=top+40, mid=top+20, base=p.clef==="bass"?18:30;
    const yOf=step=>bot-(step-base)*5;
    for(let i=0;i<5;i++) s+=`<line class="ln" x1="8" x2="${W-8}" y1="${top+i*10}" y2="${top+i*10}"/>`;
    s+=`<line class="bl" x1="8" x2="8" y1="${top}" y2="${bot}"/>`;
    if(p.clef==="bass") s+=`<text class="clef" x="14" y="${top+10}" font-size="40">𝄢</text>`;
    else s+=`<text class="clef" x="12" y="${top+30}" font-size="42">𝄞</text>`;
    if(key==="G") s+=`<text class="acc" x="46" y="${(p.clef==="bass"?bot-30:top)+7}">♯</text>`;
    if(key==="F") s+=`<text class="acc" x="47" y="${(p.clef==="bass"?bot-10:mid)+5}">♭</text>`;
    const tsx=ks?70:54;
    if(o.timeSig) s+=`<text class="ts" x="${tsx}" y="${top+18}">${bpb}</text><text class="ts" x="${tsx}" y="${top+38}">4</text>`;
    if(o.mode!=="even"){
      for(let b=bpb;b<p.total;b+=bpb) s+=`<line class="bl" x1="${left+b*unit-4}" x2="${left+b*unit-4}" y1="${top}" y2="${bot}"/>`;
      const ex=left+p.total*unit-2; s+=`<line class="bl" x1="${ex-7}" x2="${ex-7}" y1="${top}" y2="${bot}"/><line class="bl2" x1="${ex}" x2="${ex}" y1="${top}" y2="${bot}"/>`;
    } else s+=`<line class="bl" x1="${W-8}" x2="${W-8}" y1="${top}" y2="${bot}"/>`;
    if(p.name&&parts.length>1) s+=`<text class="tag" x="12" y="${top-20}">${esc(p.name)}</text>`;
    let tieFrom=null;
    p.ev.forEach((e,i)=>{
      const x=xOf(e.beat), d=o.mode==="even"?4:e.d;
      let g=`<g class="nt" data-p="${pi}" data-i="${i}">`;
      if(e.n==null){ // rest
        if(d>=4) g+=`<rect class="rest" x="${x-6}" y="${top+10}" width="12" height="5"/>`;
        else if(d>=2) g+=`<rect class="rest" x="${x-6}" y="${mid-5}" width="12" height="5"/>${d===3?`<circle class="dt" cx="${x+11}" cy="${mid-6}" r="2"/>`:""}`;

        else g+=`<circle class="rest" cx="${x-3}" cy="${mid-5}" r="2.6"/><path class="rest-ln" d="M${x-3} ${mid-3} q4 1 7 -4 l-5 14"/>`;
        g+=`</g>`; s+=g; tieFrom=null; return;

        const y=yOf(n.step);
        g+=`<ellipse class="hd${hollow?" hollow":""}" cx="${x}" cy="${y}" rx="${d>=4?7:6.2}" ry="4.4" transform="rotate(${d>=4?-12:-22} ${x} ${y})"/>`;
        const inKey=(key==="G"&&n.L==="F"&&n.acc==="#")||(key==="F"&&n.L==="B"&&n.acc==="b");
        if(n.acc&&!inKey) g+=`<text class="acc" x="${x-21}" y="${y+7}">${n.acc==="#"?"♯":"♭"}</text>`;
        if(d===1.5||d===3){ const dy=((n.step-base)%2===0)?-4:0; g+=`<circle class="dt" cx="${x+11}" cy="${y+dy}" r="2"/>`; }
      });
      const up=((lo+hi)/2-base)<4;
      if(stemmed){
        const sx=up?x+5.8:x-5.8, y1=up?yOf(lo):yOf(hi), y2=up?yOf(hi)-32:yOf(lo)+32;
        g+=`<line class="stem" x1="${sx}" x2="${sx}" y1="${y1}" y2="${y2}"/>`;
        if(d===0.5) g+=up?`<path class="flag" d="M${sx} ${y2} c 1 8 11 10 8 20"/>`:`<path class="flag" d="M${sx} ${y2} c 1 -8 11 -10 8 -20"/>`;
      }
      if(tieFrom){ const y=yOf(lo), dir=up?1:-1, yy=y+dir*7; s+=`<path class="tie" d="M${tieFrom.x+7} ${yy} Q${(tieFrom.x+x)/2} ${yy+dir*9} ${x-7} ${yy}"/>`; }
      tieFrom=e.tie?{x}:null;
      if(o.showFingers&&e.f&&!Array.isArray(e.n)&&!e.tied) g+=`<text class="fgn" x="${x}" y="${top-12}">${e.f[0]}</text>`;
      const label=o.labels?o.labels[i]:(e.label||(o.showNames&&!e.tied?(Array.isArray(e.n)?"":letterOf(e.n)):""));
      if(label) g+=`<text class="nm" x="${x}" y="${bot+42}">${esc(label)}</text>`;
      g+=`</g>`; s+=g;
    });
  });
  return s+`</svg>`;
}

function bestScore(L,id){return L&&L.scores?L.scores[id]:undefined}
function recordScore(L,id,pct){ if(!L) return; const cur=S.learners[L.id]; if(!cur) return; const old=cur.scores[id]; if(old==null||pct>old) save(L.id,{scores:{[id]:pct}}); }

    <div class="row"><button class="btn primary" type="button" data-start>Start 开始</button><span class="score" data-score></span></div></section>`);
}
function finishQuiz(n,L,id,right,total){
  $("[data-score]",n).textContent=`${right} of ${total} right`;
  const pct=Math.round(right/total*100); recordScore(L,id,pct);
  $("[data-prompt]",n).textContent=pct>=90?`${right} of ${total}. Excellent!`:pct>=60?`${right} of ${total}. Good. Try again to beat it.`:`${right} of ${total}. Keep at it; it gets easier quickly.`;
  const b=bestScore(me(),id); $("[data-best]",n).textContent=b!=null?"Your best: "+b+"%":"";
  $("[data-start]",n).textContent="Try again 再来"; $("[data-start]",n).hidden=false;
}
function quizFindKey(b,L){
  const n=quizShell(b.title,L,b.id,b.intro||"A key name appears. Tap that key anywhere on the keyboard. Your first tap counts toward your score.");
  const kb=makeKeyboard($("[data-area]",n),{from:b.from,to:b.to,labels:b.labels,centerOn:"C4"});
  const pcOf=t=>(PC[t[0]]+(t[1]==="#"?1:t[1]==="b"?-1:0)+12)%12;
  let qs=[],round=0,right=0,cur=null,first=true,active=false,lastHit=null;
  const total=()=>qs.length;
  const scoreLine=()=>{$("[data-score]",n).textContent=`Question ${Math.min(round+1,total())} of ${total()} · ${right} right first try`};
  const build=()=>{
    if(b.asks){ const [a0,...rest]=b.asks; const last=rest.filter(x=>x.notLast), mid=shuffle(rest.filter(x=>!x.notLast)); return [a0,...mid,...last]; }
    const out=[]; let prev=null; for(let i=0;i<b.rounds;i++){ let t; do{t=b.targets[Math.random()*b.targets.length|0]}while(b.targets.length>1&&t===prev); prev=t; out.push({p:`Tap ${/^[AE]/.test(t)?"an":"a"} ${pretty(t)}`,any:t}); } return out;
  };
  const ok=m=>cur.n?m===midiOf(cur.n):(m%12===pcOf(cur.any)&&!(cur.notLast&&m===lastHit));
  const ask=()=>{
    if(round>=total()){ active=false; scoreLine(); $("[data-score]",n).textContent=`${right} of ${total()} right first try`; finishQuiz(n,L,b.id,right,total()); return; }
    cur=qs[round]; first=true; $("[data-prompt]",n).textContent=cur.p; scoreLine();
  };
  const handle=(m,fromMic)=>{
    if(!active) return;
    if(fromMic){ const want=cur.n?midiOf(cur.n)%12:pcOf(cur.any);
      if(m%12===want&&!(cur.notLast&&m===lastHit)){ if(cur.n) m=midiOf(cur.n); else if(!kb.keys[m]){ const kk=Object.values(kb.keys).find(x=>(+x.dataset.m)%12===want); if(kk) m=+kk.dataset.m; } } }
    const k=kb.keys[m];
    if(!k){ $("[data-prompt]",n).textContent=`Heard ${jnText(m,"C")}. ${cur.p}.`; first=false; return; }
    if(ok(m)){
      if(first) right++; round++; lastHit=m; active=false;
      k.classList.add("good"); $("[data-prompt]",n).textContent=first?"Yes, that's it!":"Got it.";
      setTimeout(()=>{k.classList.remove("good"); active=true; ask();},800);
    } else {
      kb.flash(m,"bad"); first=false;
      const nm=jnText(m,"C");
      let hint;
      if(cur.notLast&&m===lastHit) hint="That's the same C as before. Find another one.";
      else if(cur.n&&m%12===midiOf(cur.n)%12) hint=`That's a 1, but not the one asked for. ${cur.p}.`;
      else hint=`That's ${nm}. ${cur.p}${cur.any==="C"||(cur.n&&cur.n[0]==="C")?" (just left of two black keys)":""}.`;
      $("[data-prompt]",n).textContent=hint;
    }
  };
  $(".kb",n).addEventListener("pointerdown",e=>{ const k=e.target.closest(".key"); if(k) handle(+k.dataset.m,false); });
  DISPOSE.push(micListen(m=>handle(m,true)));
  const mc=micControls(n,$("[data-prompt]",n)); if(mc){ $("[data-start]",n).parentElement.appendChild(mc.btn); $("[data-area]",n).prepend(mc.heard); }
  $("[data-start]",n).onclick=()=>{qs=build();round=0;right=0;lastHit=null;active=true;$("[data-start]",n).hidden=true;ask()};
  return n;
}
function quizFingers(b,L){
  const n=quizShell(b.title,L,b.id,"One finger lights up. Tap its number.");
  const area=$("[data-area]",n), hands=el(`<div class="hands"></div>`), ans=el(`<div class="answers" style="justify-content:center"></div>`);
  area.append(hands,ans); hands.innerHTML=handSVG("L",null)+handSVG("R",null);
  [1,2,3,4,5].forEach(k=>{const bt=el(`<button type="button" disabled>${k}</button>`);bt.onclick=()=>pick(k,bt);ans.appendChild(bt)});
  let round=0,right=0,cur=null,lock=false;
  const ask=()=>{ if(round>=b.rounds){finishQuiz(n,L,b.id,right,b.rounds);$$("button",ans).forEach(x=>x.disabled=true);return}
    const side=Math.random()<.5?"L":"R", f=1+(Math.random()*5|0); cur=f; lock=false;
    hands.innerHTML=side==="L"?handSVG("L",f)+handSVG("R",null):handSVG("L",null)+handSVG("R",f);
    $$(".hand-num",hands).forEach(t=>t.style.opacity="0");
    $("[data-prompt]",n).textContent=`Which ${side==="L"?"left":"right"}-hand finger? ${side==="L"?"左手":"右手"}哪个手指？`; $("[data-score]",n).textContent=`${round+1} of ${b.rounds} · ${right} right`;
    $$("button",ans).forEach(x=>{x.className="";x.disabled=false}); };
  const pick=(k,bt)=>{ if(lock) return; lock=true; const ok=k===cur; if(ok){right++;bt.className="good"} else {bt.className="bad";$$("button",ans)[cur-1].className="good"}
    $$(".hand-num",hands).forEach(t=>t.style.opacity="1"); $("[data-prompt]",n).textContent=ok?"Right!":`That's finger ${cur}.`; round++; setTimeout(ask,ok?700:1300); };
  $("[data-start]",n).onclick=()=>{round=0;right=0;$("[data-start]",n).hidden=true;ask()};
  return n;
}

/* ---------- 简谱 rendering ---------- */
function jpBars(notes,bpb){
  const bars=[]; let cur=[],acc=0;
  notes.forEach((nt,i)=>{ cur.push({nt,i,pos:acc}); acc+=nt.d; if(acc>=bpb-1e-6){ bars.push(cur); cur=[]; acc=0; } });
  if(cur.length) bars.push(cur);
  return bars;
}
const near=(a,b)=>Math.abs(a-b)<1e-6;
function jpNote(nt,pi,i,pos,key,u){
  const at=`data-p="${pi}" data-i="${i}"`, d=nt.d, rest=nt.n==null, tied=!!nt.tied;
  let up=0,dn=0,acc="",sym="0";
  if(!rest){ const j=jn(midiOf(Array.isArray(nt.n)?nt.n[0]:nt.n),key); acc=j.acc; sym=String(j.d); up=Math.max(0,j.oct); dn=Math.max(0,-j.oct); }
  const cell=(w,s,o={})=>`<span class="jn nt${o.dash?" dash":""}${o.gs?" gs":""}${o.ge?" ge":""}" ${at} style="width:${w}px;font-size:${w<30?17:22}px"><span class="jo">${"•".repeat(o.up||0)}</span><span class="jv${o.ul?" u"+o.ul:""}">${o.acc?`<sup>${o.acc}</sup>`:""}${s}${o.dot?'<b class="jdot">·</b>':""}</span><span class="jo">${"•".repeat(o.dn||0)}</span></span>`;
  const main=(w,x={})=>tied?cell(w,"–",{dash:true,ul:x.ul,gs:x.gs,ge:x.ge}):cell(w,sym,{up,dn,acc,...x});
  const more=w=>rest?cell(w,"0"):cell(w,"–",{dash:true});
  let h="";
  if(d>=1&&near(d,Math.round(d))){ h+=main(u); for(let k=1;k<Math.round(d);k++) h+=more(u); }
  else if(near(d,1.5)) h+=main(1.5*u,{dot:true});
  else if(d<1){ h+=main(d*u,{ul:d<=0.26?2:1,dot:near(d,0.75),gs:near(pos,Math.round(pos)),ge:near(pos+d,Math.round(pos+d))}); }
  else { const wh=Math.floor(d); h+=main(u); for(let k=1;k<wh;k++) h+=more(u); h+=more((d-wh)*u); }
  return h;
}
function jianpuHTML(o){
  const {parts,key,bpb,multi}=o, tagW=multi?26:0;
  let u=parts.some(p=>p.notes.some(x=>x.d<1))?44:40;
  const avail=(o.width||700)-18-tagW;
  let bpr=clamp(Math.floor(avail/(bpb*u+11)),1,4);
  if(bpr<2){ const u2=Math.floor((avail-22)/(2*bpb)); if(u2>=28){ bpr=2; u=Math.min(u,u2); } else { bpr=1; u=clamp(Math.floor((avail-11)/bpb),24,u); } }
  const barsBy=parts.map(p=>jpBars(p.notes,bpb)), nb=Math.max(...barsBy.map(x=>x.length));
  let h=`<div class="jhead">1=${esc(key)} &nbsp;${bpb}/4</div>`;
  for(let s=0;s<nb;s+=bpr){
    h+=`<div class="jsys">`;
    parts.forEach((p,pi)=>{
      h+=`<div class="jrow">${multi?`<span class="jtag" style="width:${tagW}px">${pi===0?"右":"左"}</span>`:""}`;
      for(let bi=s;bi<Math.min(nb,s+bpr);bi++){
        const bar=barsBy[pi][bi]||[];
        h+=`<span class="jbar${bi===s?" first":""}${bi===nb-1?" end":""}" data-bar="${bi+1}">${pi===0?`<span class="jbn">${bi+1}</span>`:""}${bar.map(({nt,i,pos})=>jpNote(nt,pi,i,pos,key,u)).join("")}</span>`;
      }
      h+=`</div>`;
    });
    h+=`</div>`;
  }
  return h;
}

  const kb=makeKeyboard($("#fpKb"),{from:"C2",to:"C7",labels,key:"C",centerOn:"C4"});
  $$("#fpLabels button").forEach(b=>b.onclick=()=>{labels=b.dataset.v;kb.setLabels(labels);$$("#fpLabels button").forEach(x=>x.setAttribute("aria-pressed",x===b))});
  const tp=$("#fpTempo"); tp.oninput=()=>tp.nextElementSibling.textContent=tp.value+" bpm";
  const stopMet=()=>{ if(met){clearInterval(met.iv);killBus(met.bus);met=null;$("#fpMet")&&($("#fpMet").textContent="Start metronome")} };
  $("#fpMet").onclick=()=>{
    if(met){stopMet();return}
    const c=audio(); if(!c) return; const bus=newBus(); let next=c.currentTime+0.1, beat=0;
    met={bus,iv:setInterval(()=>{ const spb=60/(+tp.value); while(next<c.currentTime+0.25){ click(next,beat%4===0,bus); next+=spb; beat++; } },50)};
    $("#fpMet").textContent="Stop metronome";
  };
  DISPOSE.push(stopMet);
  if(MIC_OK){
    const hint=$("#fpHint"); const mc=micControls(app,hint,"C"); $("#fpMicRow").appendChild(mc.btn);
    const lv=()=>{ const x=$("#fpLvl"); if(x) x.style.width=(Mic.level*100)+"%"; if(!Mic.on&&$("#fpNote")) $("#fpNote").textContent="–"; };
    Mic.ui.add(lv); DISPOSE.push(()=>Mic.ui.delete(lv));
    DISPOSE.push(micListen(m=>{ $("#fpNote").innerHTML=`${esc(jnText(m,"C"))} <span class="small muted">${esc(noteLabel(m))}</span>`; kb.flash(m,"play"); kb.center(m); }));
  }
}

/* ---------- start ---------- */
S.learners=lsGet("vp.local",{})||{};
ensureVan();
route();
if(Sync.cfg) syncNow();

</script>
